<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
      @page {size:594mm 210mm; margin:10mm;}
      body { font-family: Arial; }
      .spread {display:flex; width:100%; height: 100%}
      .column{display:flex; width:50%; padding:10px; box-sizing:border-box;}
      .entry{border: 1px solid #444; padding:5px; margin-bottom:10px;}
      h2 { text-align: center; margin-bottom:10px}
  </style>
</head>
<body>
 <div class="spread">
     <!-- left column:open entries -->
     <div class="column">
         <h2> Open Entries</h2>
         {% for entry in open_entries %}
         
     </div>

   <div class="details">
     <p><strong>ID:</strong> {{pair.open.id}}</p>
     <p><strong>Description:</strong> {{pair.open.description}}</p>
   </div>
 </div>

 <div class="page-brake"></div>

 <!-- Right page: Closed entry -->
 <div class="entry">
   <h1> Closed Entry</h1>
   <div class="details">
     <p><strong>ID:</strong> {{pair.open.id}}</p>
     <p><strong>Description:</strong> {{pair.closed.description}}</p>
   </div>
 </div>

 <div class="page-brake"></div>
 {% endfor %}

</body>
</html>
